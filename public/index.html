<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Pet Resorts - Luxury Pet Care</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container">
            <div class="top-bar-content">
                <div class="location-link">
                    <svg class="location-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 0C4.13 0 1 3.13 1 7C1 11.17 7 16 8 16C9 16 15 11.17 15 7C15 3.13 11.87 0 8 0ZM8 9.5C6.62 9.5 5.5 8.38 5.5 7C5.5 5.62 6.62 4.5 8 4.5C9.38 4.5 10.5 5.62 10.5 7C10.5 8.38 9.38 9.5 8 9.5Z" fill="currentColor"/>
                    </svg>
                    <span>FIND A RESORT NEAR YOU</span>
                </div>
                <div class="phone-number">
                    <a href="tel:+16504190278">(650) 419-0278</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <img src="/assets/images/BayPetLogo.png" alt="Bay Pet Resorts" class="logo-icon">
                    <span class="logo-text">BAY PET RESORTS</span>
                </div>
                <nav class="main-nav">
                    <a href="#boarding" class="nav-link">LUXURY BOARDING</a>
                    <a href="#daycare" class="nav-link">DOGGIE DAYCARE</a>
                    <a href="#why" class="nav-link">WHY WE'RE BETTER</a>
                    <a href="#about" class="nav-link">ABOUT</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-video-container">
            <video class="hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
                <source src="/assets/videos/DogRunningOnBeach.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="hero-overlay">
                <div class="hero-content">
                    <div class="hero-text">
                        <h1 class="hero-headline">
                            Beach trips for your dog.<br>
                            Happiness Gauranteed.
                        </h1>
                        <a href="/register" class="btn-register-dog">Register Your Dog</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
