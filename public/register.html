<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your Dog - Bay Pet Resorts</title>
    <link rel="icon" type="image/png" href="/assets/images/BayPetLogo.png">
    <link rel="apple-touch-icon" href="/assets/images/BayPetLogo.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/components.js" defer></script>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1375484534303889');

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1375484534303889&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
    <script src="/meta-pixel-tracking.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <!-- Registration Form Page -->
    <div class="register-page">
        <div class="container">
            <style>
                .register-iframe-container {
                    width: 100%;
                    min-height: 800px;
                    margin: 0 auto;
                    padding: 20px 0;
                }
                
                .register-iframe-container iframe {
                    width: 100%;
                    border: none;
                    display: block;
                    min-height: 800px;
                    background: transparent;
                }
                
                @media (max-width: 768px) {
                    .register-iframe-container {
                        padding: 10px 0;
                        min-height: 600px;
                    }
                    
                    .register-iframe-container iframe {
                        min-height: 600px;
                    }
                }
            </style>
            <div class="register-iframe-container">
                <iframe 
                    id="dogRegFormIframe"
                    src="/dog-registration-form-component.html" 
                    width="100%" 
                    height="800" 
                    frameborder="0"
                    scrolling="no"
                    title="Dog Registration Form">
                </iframe>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        // Listen for messages from the iframe
        window.addEventListener('message', function(event) {
            const iframe = document.getElementById('dogRegFormIframe');
            
            // Handle iframe resize
            if (iframe && event.data && event.data.type === 'resize') {
                iframe.style.height = event.data.height + 'px';
            }
            
            // Handle scroll to container request from iframe
            if (event.data && event.data.type === 'scrollToContainer') {
                const container = document.querySelector('.register-iframe-container');
                if (container) {
                    setTimeout(() => {
                        container.scrollIntoView({ 
                            behavior: 'instant', 
                            block: 'start' 
                        });
                    }, 100);
                }
            }
            
            // Handle URL update for Facebook Custom Conversion tracking
            if (event.data && event.data.type === 'updateUrl' && event.data.url) {
                // Set flag so thank-you page knows form was legitimately submitted
                sessionStorage.setItem('formSubmitted', 'true');
                // Redirect to actual thank-you page (triggers real page load for Facebook tracking)
                window.location.href = event.data.url;
            }
        });
    </script>
</body>
</html>
